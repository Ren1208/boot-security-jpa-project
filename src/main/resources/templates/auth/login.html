<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Вход в систему')}"></head>
<body>

<div class="card card-info card-narrow">
    <div class="card-title">🔐 Вход в систему</div>

    <form name="f" method="post" action="/process_login">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div th:if="${param.error}" class="alert alert-error">
            ⚠️ Неверно указан логин или пароль, либо учётная запись заблокирована
        </div>

        <div th:if="${param.passwordChanged}" class="alert alert-success">
            ✅ Пароль успешно изменён. Войдите с новым паролем.
        </div>

        <div th:if="${param.logout}" class="alert alert-success">
            ✅ Вы вышли из системы
        </div>

        <div class="form-group">
            <label for="username">👤 ФИО (логин)</label>
            <input type="text" name="username" id="username"
                   placeholder="Иванов Иван Иванович" autofocus/>
        </div>

        <div class="form-group">
            <label for="password">🔑 Пароль</label>
            <input type="password" name="password" id="password"
                   placeholder="Введите пароль"/>
        </div>

        <hr/>

        <input class="btn btn-info btn-block-centered" type="submit" value="Войти"/>

        <div class="hint mt-20" style="text-align: center;">
            Доступ предоставляется администратором библиотеки.<br/>
            Если у вас нет учётной записи — обратитесь к руководству.
        </div>
    </form>
</div>

</body>
</html>
