<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Назначить администратора')}"></head>
<body>

<div class="toolbar">
    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div class="card card-danger">
    <div class="card-title">🔑 Назначение администратора</div>

    <div th:if="${not #lists.isEmpty(people)}">
        <div class="alert alert-warning">
            ⚠️ Вы собираетесь выдать права администратора библиотекарю.
            Администратор сможет управлять книгами и создавать сотрудников.
        </div>

        <form th:method="POST" th:action="@{/admin/setAdmin}">
            <div class="form-group">
                <label for="person">👤 Выберите библиотекаря:</label>
                <select name="personId" id="person">
                    <option th:each="p : ${people}"
                            th:value="${p.personId}"
                            th:text="${p.name}"></option>
                </select>
            </div>

            <hr/>

            <div class="form-actions">
                <input class="btn btn-danger" type="submit"
                       value="👑 Назначить администратором"/>
            </div>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(people)}" class="empty-message">
        <span class="empty-message-icon">⚠️</span>
        <div class="empty-message-text">Нет библиотекарей для повышения</div>
        <div class="empty-message-subtext">
            Сначала создайте сотрудника с ролью «Библиотекарь» в разделе
            <a th:href="@{/staff/new}">«Создание сотрудника»</a>
        </div>
    </div>
</div>

</body>
</html>
