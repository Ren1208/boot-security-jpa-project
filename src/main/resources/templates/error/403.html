<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Доступ запрещён')}"></head>
<body>

<div class="card card-danger card-narrow">
    <div class="card-title">🚫 Доступ запрещён (403)</div>

    <p style="font-size: 16px;">
        У вас недостаточно прав для просмотра этой страницы.
    </p>

    <hr/>

    <div class="form-actions">
        <form th:action="@{/hello}" th:method="GET">
            <input class="btn btn-primary" type="submit"
                   value="🏠 Вернуться на главную"/>
        </form>

        <form th:action="@{/logout}" th:method="POST">
            <input class="btn btn-secondary" type="submit"
                   value="🚪 Войти под другой учётной записью"/>
        </form>
    </div>
</div>

</body>
</html>
