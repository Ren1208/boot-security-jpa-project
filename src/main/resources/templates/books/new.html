<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Добавление книги')}"></head>
<body>

<div class="toolbar">
    <a th:href="@{/books}" class="btn btn-secondary">← К списку книг</a>
    <span class="toolbar-divider">|</span>
    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div class="card card-success">
    <div class="card-title">➕ Добавление новой книги</div>

    <form th:method="POST" th:action="@{/books}" th:object="${book}">
        <div class="form-group">
            <label for="name">📖 Название книги:</label>
            <input type="text" th:field="*{name}" id="name"
                   placeholder="Введите название книги"/>
            <div class="error-message" th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="author">✍️ Автор:</label>
            <input type="text" th:field="*{author}" id="author"
                   placeholder="Введите автора"/>
            <div class="error-message" th:if="${#fields.hasErrors('author')}"
                 th:errors="*{author}"></div>
        </div>

        <div class="form-group">
            <label for="yearOfRelease">📅 Год выпуска:</label>
            <input type="text" th:field="*{yearOfRelease}" id="yearOfRelease"
                   placeholder="Введите год выпуска"/>
            <div class="error-message" th:if="${#fields.hasErrors('yearOfRelease')}"
                 th:errors="*{yearOfRelease}"></div>
        </div>

        <hr/>

        <div class="form-actions">
            <input class="btn btn-success" type="submit" value="✅ Добавить"/>
        </div>
    </form>
</div>

</body>
</html>
