<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Изменение книги')}"></head>
<body>

<div class="toolbar">
    <a th:href="@{/books}" class="btn btn-secondary">← К списку книг</a>
    <span class="toolbar-divider">|</span>
    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div class="card card-warning">
    <div class="card-title">✏️ Редактирование книги</div>

    <div style="background-color: white; padding: 15px; border-radius: 4px;
                margin-bottom: 20px; border-left: 4px solid #007bff;">
        <span style="font-weight: bold; color: #6c757d; font-size: 14px;
                     display: block; margin-bottom: 5px;">📖 Текущие данные:</span>
        <span style="font-size: 16px;"
              th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getYearOfRelease()}"></span>
    </div>

    <form th:method="PATCH" th:action="@{/books/{id}(id=${book.getBookId()})}"
          th:object="${book}">
        <div class="form-group">
            <label for="name">📖 Название книги:</label>
            <input type="text" th:field="*{name}" id="name"
                   placeholder="Введите название книги"/>
            <div class="error-message" th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="author">✍️ Автор:</label>
            <input type="text" th:field="*{author}" id="author"
                   placeholder="Введите автора"/>
            <div class="error-message" th:if="${#fields.hasErrors('author')}"
                 th:errors="*{author}"></div>
        </div>

        <div class="form-group">
            <label for="yearOfRelease">📅 Год выпуска:</label>
            <input type="text" th:field="*{yearOfRelease}" id="yearOfRelease"
                   placeholder="Введите год выпуска"/>
            <div class="error-message" th:if="${#fields.hasErrors('yearOfRelease')}"
                 th:errors="*{yearOfRelease}"></div>
        </div>

        <hr/>

        <div class="form-actions">
            <input class="btn btn-warning" type="submit" value="💾 Сохранить изменения"/>
            <span class="toolbar-divider">|</span>
            <a th:href="@{/books/{id}(id=${book.getBookId()})}" class="btn btn-secondary">
                ← Назад к книге
            </a>
        </div>
    </form>
</div>

</body>
</html>
