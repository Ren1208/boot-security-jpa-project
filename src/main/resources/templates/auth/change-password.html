<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Смена временного пароля')}"></head>
<body>

<div class="card card-warning card-narrow">
    <div class="card-title">🔑 Смена временного пароля</div>

    <div class="alert alert-warning">
        ⚠️ Вы входите по временному паролю. Для продолжения работы необходимо
        задать новый пароль. После смены пароля потребуется повторный вход.
    </div>

    <form th:method="POST" th:action="@{/auth/change-password}" th:object="${form}">

        <div class="form-group">
            <label for="newPassword">🔒 Новый пароль</label>
            <input type="password" th:field="*{newPassword}" id="newPassword"
                   placeholder="Минимум 6 символов"/>
            <div class="hint">Используйте надёжный пароль, который вы запомните</div>
            <div class="error-message" th:if="${#fields.hasErrors('newPassword')}"
                 th:errors="*{newPassword}"></div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">🔒 Подтвердите пароль</label>
            <input type="password" th:field="*{confirmPassword}" id="confirmPassword"
                   placeholder="Повторите пароль"/>
            <div class="error-message" th:if="${#fields.hasErrors('confirmPassword')}"
                 th:errors="*{confirmPassword}"></div>
        </div>

        <hr/>

        <input class="btn btn-warning btn-block-centered" type="submit"
               value="💾 Сохранить новый пароль"/>
    </form>
</div>

</body>
</html>
