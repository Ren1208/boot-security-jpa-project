<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/layout :: head('Информация о книге')}"></head>
<body>

<div class="toolbar">
    <a th:href="@{/books}" class="btn btn-secondary">← К списку книг</a>
    <span class="toolbar-divider">|</span>
    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div class="card card-primary card-wide">
    <div class="card-title">📖 Информация о книге</div>

    <div style="font-size: 18px; padding: 15px; background-color: white;
                border-radius: 4px; margin-bottom: 20px;">
        <span th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getYearOfRelease()}"></span>
    </div>

    <!-- LIBRARIAN: только статус, без действий -->
    <div sec:authorize="hasRole('LIBRARIAN')">
        <div th:if="${owner}" class="alert alert-error" style="font-weight: normal;">
            ⛔ Книга сейчас у: <strong th:text="${owner.getName()}"></strong>
        </div>
        <div th:if="${owner == null}" class="alert alert-success" style="font-weight: normal;">
            ✅ Книга свободна
        </div>
    </div>

    <!-- ADMIN / SUPER_ADMIN / LIBRARIAN: выдача и возврат -->
    <div sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN', 'LIBRARIAN')">
        <div th:if="${owner}" class="info-box occupied">
            <div style="margin-bottom: 15px;">
                <span style="font-weight: bold;">📖 Книга сейчас у:</span>
                <span th:text="${owner.getName()}" style="color: #dc3545; font-weight: bold;"></span>
            </div>
            <form th:method="PATCH"
                  th:action="@{/books/{id}/release(id=${book.getBookId()})}">
                <input class="btn btn-danger" type="submit" value="🔓 Освободить книгу"/>
            </form>
        </div>

        <div th:if="${owner == null}" class="info-box free">
            <p style="font-weight: bold; color: #28a745; margin-bottom: 15px;">
                ✅ Эта книга свободна. Кому назначить её?
            </p>
            <form th:method="PATCH"
                  th:action="@{/books/{id}/assign(id=${book.getBookId()})}">
                <div class="form-group">
                    <label for="person">👤 Выберите человека:</label>
                    <select th:object="${person}" th:field="*{personId}" id="person">
                        <option th:each="person : ${people}"
                                th:value="${person.getPersonId()}"
                                th:text="${person.getName()}"></option>
                    </select>
                </div>
                <input class="btn btn-success" type="submit" value="📌 Назначить книгу"/>
            </form>
        </div>
    </div>

    <!-- ADMIN / SUPER_ADMIN: редактирование и удаление -->
    <div sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN')">
        <hr/>
        <div class="form-actions">
            <form th:method="GET"
                  th:action="@{/books/{id}/edit(id=${book.getBookId()})}">
                <input class="btn btn-warning" type="submit" value="✏️ Редактировать"/>
            </form>
            <form th:method="DELETE"
                  th:action="@{/books/{id}(id=${book.getBookId()})}">
                <input class="btn btn-danger" type="submit" value="🗑️ Удалить"
                       onclick="return confirm('Вы уверены, что хотите удалить эту книгу?');"/>
            </form>
        </div>
    </div>
</div>

</body>
</html>
