<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Лишение прав администратора')}"></head>
<body>

<div class="toolbar">
    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div class="card card-warning">
    <div class="card-title">🔽 Лишение прав администратора</div>

    <div th:if="${not #lists.isEmpty(people)}">
        <div class="alert alert-warning">
            ⚠️ Вы собираетесь понизить администратора до библиотекаря.
            Он потеряет доступ к управлению пользователями и созданию сотрудников.
        </div>

        <form th:method="POST" th:action="@{/admin/removeAdmin}">
            <div class="form-group">
                <label for="person">👤 Выберите администратора:</label>
                <select name="personId" id="person">
                    <option th:each="p : ${people}"
                            th:value="${p.personId}"
                            th:text="${p.name}"></option>
                </select>
            </div>

            <hr/>

            <div class="form-actions">
                <input class="btn btn-warning" type="submit"
                       value="🔽 Лишить прав администратора"/>
            </div>
        </form>
    </div>

    <div th:if="${#lists.isEmpty(people)}" class="empty-message">
        <span class="empty-message-icon">ℹ️</span>
        <div class="empty-message-text">Нет администраторов для лишения прав</div>
        <div class="empty-message-subtext">
            На данный момент нет пользователей с правами администратора
        </div>
    </div>
</div>

</body>
</html>
