<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Информация о человеке')}"></head>
<body>

<div class="toolbar">
  <a th:href="@{/people}" class="btn btn-secondary">← К списку людей</a>
  <span class="toolbar-divider">|</span>
  <form th:method="GET" th:action="@{/hello}">
    <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
  </form>
</div>

<hr/>

<div class="card card-primary card-wide">
  <div class="card-title">👤 Информация о человеке</div>

  <div style="font-size: 18px; padding: 15px; background-color: white;
                border-radius: 4px; margin-bottom: 20px;">
    <span th:text="${person.getName() + ', ' + person.getDateOfBirth()}"></span>
  </div>

  <div th:if="${books.isEmpty()}" class="info-box empty">
    <div style="font-size: 16px; color: #383d41;">
      📚 Человек пока не взял ни одной книги
    </div>
  </div>

  <div th:if="${!books.isEmpty()}" class="info-box has-books">
    <p style="font-weight: bold; color: #28a745; margin-bottom: 15px;">
      📚 Книги на руках:
    </p>
    <ul class="books-list">
      <li th:each="book : ${books}"
          th:classappend="${book.isExpired()} ? 'expired'">
        <span th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getYearOfRelease()}"></span>
        <span th:if="${book.isExpired()}" style="font-weight: bold;">
                    ⚠️ просрочена
                </span>
      </li>
    </ul>
  </div>

  <div class="form-actions">
    <form th:method="GET"
          th:action="@{/people/{id}/edit(id=${person.getPersonId()})}">
      <input class="btn btn-warning" type="submit" value="✏️ Редактировать"/>
    </form>

    <form th:if="${person.role != 'ROLE_SUPER_ADMIN'}"
          th:method="DELETE"
          th:action="@{/people/{id}(id=${person.getPersonId()})}">
      <input class="btn btn-danger" type="submit" value="🗑️ Удалить"
             onclick="return confirm('Вы уверены, что хотите удалить этого человека?');"/>
    </form>
  </div>
</div>

</body>
</html>
