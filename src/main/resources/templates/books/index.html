<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/layout :: head('Управление книгами')}"></head>
<body>

<div class="toolbar">
    <form th:method="GET" th:action="@{/books}">
        <label for="query">Поиск книги по названию: </label>
        <input type="text" id="query" name="query" th:value="${param.query}"/>
        <input class="btn btn-info" type="submit" value="Искать!"/>
    </form>

    <span class="toolbar-divider">|</span>

    <form th:method="GET" th:action="@{/books}">
        <input class="btn btn-success" type="submit" value="📚 Все книги"/>
    </form>

    <div sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN')">
        <span class="toolbar-divider">|</span>
        <form th:method="GET" th:action="@{/books/new}">
            <input class="btn btn-warning" type="submit" value="➕ Добавить книгу"/>
        </form>
    </div>

    <span class="toolbar-divider">|</span>

    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div class="card card-info card-wide" th:if="${books}">
    <div class="card-title">
        <span th:if="${allBooks == true}">📚 Список всех книг</span>
        <span th:if="${allBooks == false}">🔍 Найденные книги по названию</span>
    </div>

    <div th:if="${books.isEmpty()}" class="empty-message">
        <span class="empty-message-icon">ℹ️</span>
        <div class="empty-message-text">Книг не найдено</div>
        <div class="empty-message-subtext">Попробуйте изменить условия поиска</div>
    </div>

    <div th:unless="${books.isEmpty()}">
        <div th:each="book : ${books}" class="list-item">
            <span class="list-item-index" th:text="'#' + ${bookStat.count}"></span>
            <a th:href="@{/books/{id}(id=${book.getBookId()})}"
               th:text="${book.getName() + ', ' + book.getAuthor() + ', ' + book.getYearOfRelease()}"
               class="list-item-link"></a>

            <div th:if="${book.getOwner() != null}"
                 style="margin-top: 6px; font-size: 14px; color: #6c757d;">
                📖 Книга сейчас у: <span th:text="${book.getOwner().getName()}"></span>
            </div>

            <div th:if="${book.getOwner() == null}"
                 style="margin-top: 6px; font-size: 14px; color: #28a745;">
                ✅ Книга свободна
            </div>
        </div>

        <hr/>

        <div class="list-footer">
            Всего книг: <span th:text="${#lists.size(books)}"></span>
        </div>
    </div>
</div>

</body>
</html>
