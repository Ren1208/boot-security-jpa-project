<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Изменение человека')}"></head>
<body>

<div class="toolbar">
  <a th:href="@{/people}" class="btn btn-secondary">← К списку людей</a>
  <span class="toolbar-divider">|</span>
  <form th:method="GET" th:action="@{/hello}">
    <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
  </form>
</div>

<hr/>

<div class="card card-warning">
  <div class="card-title">✏️ Редактирование человека</div>

  <div style="background-color: white; padding: 15px; border-radius: 4px;
                margin-bottom: 20px; border-left: 4px solid #007bff;">
        <span style="font-weight: bold; color: #6c757d; font-size: 14px;
                     display: block; margin-bottom: 5px;">👤 Текущие данные:</span>
    <span style="font-size: 16px;"
          th:text="${person.getName() + ', ' + person.getDateOfBirth()}"></span>
  </div>

  <form th:method="PATCH"
        th:action="@{/people/{id}(id=${person.getPersonId()})}"
        th:object="${person}">

    <div class="form-group">
      <label for="name">👤 ФИО:</label>
      <input type="text" th:field="*{name}" id="name" placeholder="Введите ФИО"/>
      <div class="error-message" th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}"></div>
    </div>

    <div class="form-group">
      <label for="dateOfBirth">📅 Дата рождения:</label>
      <input type="date" th:field="*{dateOfBirth}" id="dateOfBirth"/>
      <div class="error-message" th:if="${#fields.hasErrors('dateOfBirth')}"
           th:errors="*{dateOfBirth}"></div>
    </div>

    <hr/>

    <div class="form-actions">
      <input class="btn btn-warning" type="submit" value="💾 Сохранить изменения"/>
      <span class="toolbar-divider">|</span>
      <a th:href="@{/people/{id}(id=${person.getPersonId()})}"
         class="btn btn-secondary">← Назад к человеку</a>
    </div>
  </form>
</div>

</body>
</html>
