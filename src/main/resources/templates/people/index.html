<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Список людей')}"></head>
<body>

<div class="toolbar">
    <form th:method="GET" th:action="@{/hello}">
        <input class="btn btn-primary" type="submit" value="🏠 В главное меню"/>
    </form>
</div>

<hr/>

<div th:if="${param.forbidden}" class="alert alert-error">
    ⚠️ У вас недостаточно прав для выполнения этого действия.
</div>

<div class="card card-info card-wide">
    <div class="card-title">👥 Список людей</div>

    <div th:if="${not #lists.isEmpty(people)}">
        <div th:each="person : ${people}" class="list-item">
            <span class="list-item-index" th:text="'#' + ${personStat.count}"></span>
            <a th:href="@{/people/{id}(id=${person.getPersonId()})}"
               th:text="${person.getName() + ', ' + person.getDateOfBirth()}"
               class="list-item-link"></a>
        </div>

        <hr/>

        <div class="list-footer">
            Всего людей: <span th:text="${#lists.size(people)}"></span>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(people)}" class="empty-message">
        <span class="empty-message-icon">ℹ️</span>
        <div class="empty-message-text">Список людей пуст</div>
        <div class="empty-message-subtext">
            На данный момент нет зарегистрированных пользователей
        </div>
    </div>
</div>

</body>
</html>
