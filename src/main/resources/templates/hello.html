<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/layout :: head('Главное меню')}"></head>
<body>

<div class="card card-primary">
    <div class="card-title">🏠 Главное меню</div>

    <div class="greeting">
        👋 Здравствуйте, <span class="greeting-name" th:text="${person.name}">Имя</span>
        <span class="role-badge badge-super-admin"
              th:if="${person.role == 'ROLE_SUPER_ADMIN'}">Супер-админ</span>
        <span class="role-badge badge-admin"
              th:if="${person.role == 'ROLE_ADMIN'}">Администратор</span>
        <span class="role-badge badge-librarian"
              th:if="${person.role == 'ROLE_LIBRARIAN'}">Библиотекарь</span>
    </div>

    <hr/>

    <div class="menu-section">
        <div class="menu-section-title">📚 Работа с книгами</div>
        <form th:action="@{/books}" th:method="GET">
            <input class="menu-btn btn-primary" type="submit"
                   value="📖 Поиск и управление книгами"/>
        </form>
    </div>

    <div sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN')">
        <hr/>
        <div class="menu-section">
            <div class="menu-section-title">👥 Пользователи</div>
            <form th:action="@{/people}" th:method="GET">
                <input class="menu-btn btn-secondary" type="submit"
                       value="👤 Список всех пользователей"/>
            </form>
        </div>
    </div>

    <div sec:authorize="hasAnyRole('ADMIN', 'SUPER_ADMIN')">
        <hr/>
        <div class="menu-section">
            <div class="menu-section-title">🧑‍💼 Сотрудники библиотеки</div>
            <form th:action="@{/staff}" th:method="GET">
                <input class="menu-btn btn-success" type="submit"
                       value="👥 Управление сотрудниками"/>
            </form>
        </div>
    </div>

    <div sec:authorize="hasRole('SUPER_ADMIN')">
        <hr/>
        <div class="menu-section">
            <div class="menu-section-title">🛡️ Управление администраторами</div>
            <form th:action="@{/admin/setAdmin}" th:method="GET">
                <input class="menu-btn btn-success" type="submit"
                       value="⬆️ Назначить администратора"/>
            </form>
            <form th:action="@{/admin/removeAdmin}" th:method="GET">
                <input class="menu-btn btn-warning" type="submit"
                       value="⬇️ Лишить прав администратора"/>
            </form>
        </div>
    </div>

    <hr/>

    <form th:action="@{/logout}" th:method="POST">
        <input class="menu-btn btn-danger" type="submit"
               value="🚪 Выйти из учётной записи"/>
    </form>
</div>

</body>
</html>
